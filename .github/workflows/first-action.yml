name: Mohammed-Imran
on: issues
jobs:
  first_job:
    runs-on: macos-latest
    steps:
      - name: Get_code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependency
        run: ci
      - name: Run test
        run: npm test
  deploy:
      runs-on: ubuntu-latest
      steps:
        - name: get Code
          uses: actions/checkout@v3
        - name: Install Node-JS
          uses: actions/setup-node@v3
          with:
            node-version: 19
        - name: Install Dependency
          run: npm ci
        - name: Build Project
          run: npm run build
        - name: Deploy
          run: echo "Deploying....."
    
